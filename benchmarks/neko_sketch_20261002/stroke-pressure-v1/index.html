<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neko 单笔粗细实验</title>
<style>body{max-width:900px;margin:24px auto;padding:0 16px;font:16px/1.6 system-ui,sans-serif;color:#171717}h1{font-size:24px}#controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button{font:inherit;padding:5px}#stage{width:320px;max-width:100%;margin:20px 0}#stage canvas{display:block;height:auto}#profile{width:320px;max-width:100%}.muted{color:#666}</style>
<h1>Neko：单个笔画内的粗细变化</h1><p>固定相同路径，比较等宽、现有笔触、距离模拟压力和沿程压力曲线。当前输入只有坐标，压力曲线为设计模拟，未采集真实笔压。</p>
<div id="controls"><label>图形 <select id="case"></select></label><label>笔触 <select id="mode"></select></label><label>基本宽度 <input id="width" type="range" min="1.5" max="4" value="3" step="0.1"></label><button id="replay">重放落笔</button><button id="download">导出 SVG</button></div>
<div id="stage"></div><p id="summary"></p><canvas id="profile" width="320" height="150"></canvas>
<p class="muted">长笔轻入、加力、提笔；闭合圈采用连续周期压力，短笔减少粗细振幅。播放只增加已落下的墨迹；不是逐帧重新决定旧笔画的压力。</p>
